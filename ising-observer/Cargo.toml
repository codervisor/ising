[package]
name = "ising-observer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Ising factory observer — watches the Onsager event spine and emits insights"

[dependencies]
onsager = { git = "https://github.com/onsager-ai/onsager.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
